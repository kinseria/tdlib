name: Build TDLib Android AAR

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          cmake \
          ninja-build \
          gperf \
          unzip \
          zip


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install Android tools
      run: |
        sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;26.1.10909125"


    - name: Clone TDLib
      run: |
        git clone --recursive https://github.com/tdlib/td.git


    - name: Build TDLib Android example
      run: |

        cd td/example/android

        chmod +x gradlew

        ./gradlew \
          :tdlib:assembleRelease \
          --no-daemon


    - name: Find AAR
      run: |

        find td -name "*.aar"


    - name: Upload TDLib AAR
      uses: actions/upload-artifact@v4
      with:

        name: TDLib-aar

        path: |
          td/**/*.aar
