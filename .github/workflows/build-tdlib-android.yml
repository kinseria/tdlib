name: Build TDLib Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_API: 24

    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          path: td

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            git \
            unzip \
            zip

      - name: Configure
        run: |
          mkdir build

          cmake -S td -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=ON \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-${ANDROID_API}

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Collect
        run: |
          mkdir -p artifacts/${{ matrix.abi }}

          find build -name "*.so" -exec cp {} artifacts/${{ matrix.abi }}/ \;

          find build -name "*.jar" -exec cp {} artifacts/${{ matrix.abi }}/ \; || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}
