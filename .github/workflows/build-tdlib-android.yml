name: Build TDLib Android AAR

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: "26.1.10909125"

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          cmake \
          ninja-build \
          zip \
          unzip


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install Android NDK
      run: |
        sdkmanager "ndk;${NDK_VERSION}"

        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV


    - name: Clone TDLib
      run: |
        git clone \
        --recursive \
        https://github.com/tdlib/td.git


    - name: Generate TDLib sources
      run: |
        mkdir -p td/build-generation

        cmake -S td \
          -B td/build-generation \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release

        cmake --build td/build-generation --target generate



    #
    # Build ARM64
    #
    - name: Build arm64-v8a
      run: |
        mkdir -p build-arm64

        cmake -S td -B build-arm64 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DTD_ENABLE_JNI=ON \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21

        ninja -C build-arm64


    #
    # Build ARM32
    #
    - name: Build armeabi-v7a
      run: |
        mkdir -p build-arm32

        cmake -S td -B build-arm32 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DTD_ENABLE_JNI=ON \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-21

        ninja -C build-arm32



    #
    # Find generated files
    #
    - name: Locate TDLib output
      run: |
        find . -name "libtdjni.so"
        find . -name "TdApi.java"
        find . -name "Client.java"



    #
    # Create AAR
    #
    - name: Prepare AAR
      run: |

        mkdir -p aar/jni/arm64-v8a
        mkdir -p aar/jni/armeabi-v7a
        mkdir -p aar/classes


        cp $(find build-arm64 -name libtdjni.so | head -1) \
          aar/jni/arm64-v8a/


        cp $(find build-arm32 -name libtdjni.so | head -1) \
          aar/jni/armeabi-v7a/


        cp -r $(dirname $(find td -name TdApi.java | head -1))/* \
          aar/classes/



    - name: Compile Java classes
      run: |

        mkdir classes

        javac \
          -source 8 \
          -target 8 \
          $(find aar/classes -name "*.java") \
          -d classes



    - name: Create classes.jar
      run: |

        cd classes

        jar cf ../aar/classes.jar .



    - name: Create TDLib.aar
      run: |

        cd aar

        zip -r TDLib.aar \
          classes.jar \
          jni



    - name: Upload TDLib.aar
      uses: actions/upload-artifact@v4
      with:

        name: TDLib-aar

        path: aar/TDLib.aar
