name: Build TDLib Android

on:
  workflow_dispatch:
    inputs:
      tdlib_version:
        description: "TDLib version (tag or branch)"
        required: false
        default: "master"

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-22.04

    strategy:
      matrix:
        abi:
          - armeabi-v7a
          - arm64-v8a
          - x86
          - x86_64

    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      API_LEVEL: 21

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          cmake \
          ninja-build \
          gperf \
          build-essential \
          zip \
          unzip \
          wget \
          curl \
          python3

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager "ndk;$ANDROID_NDK_VERSION"

    - name: Clone TDLib
      run: |
        git clone https://github.com/tdlib/td.git
        cd td
        git checkout "${{ github.event.inputs.tdlib_version || 'master' }}"

    - name: Configure
      run: |
        mkdir td/build

        cmake -S td \
          -B td/build \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DANDROID_ABI=${{ matrix.abi }} \
          -DANDROID_PLATFORM=android-${API_LEVEL} \
          -DANDROID_NDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake \
          -DTD_ENABLE_JNI=ON

    - name: Build
      run: |
        cmake --build td/build --parallel

    - name: Package
      run: |
        mkdir -p artifacts/${{ matrix.abi }}

        find td/build -name "*.so" -exec cp {} artifacts/${{ matrix.abi }}/ \;

        find td/build -name "*.jar" -exec cp {} artifacts/${{ matrix.abi }}/ \;

    - name: Upload ABI
      uses: actions/upload-artifact@v4
      with:
        name: tdlib-${{ matrix.abi }}
        path: artifacts/${{ matrix.abi }}

  release:

    if: startsWith(github.ref, 'refs/tags/')

    needs: build

    runs-on: ubuntu-22.04

    steps:

    - uses: actions/download-artifact@v4
      with:
        path: release

    - uses: softprops/action-gh-release@v2
      with:
        files: release/**/*
