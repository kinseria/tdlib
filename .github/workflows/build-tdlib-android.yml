name: Build TDLib Android AAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            cmake \
            ninja-build \
            unzip \
            openjdk-17-jdk \
            wget

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        run: |
          sdkmanager "ndk;26.1.10909125"

      - name: Clone TDLib
        run: |
          git clone --depth=1 https://github.com/tdlib/td.git

      - name: Build TDLib
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          mkdir td/build
          cd td/build

          cmake .. \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=ON \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

          ninja

      - name: Create AAR structure
        run: |
          mkdir -p aar/jni/arm64-v8a
          mkdir -p aar/classes

          cp td/build/lib/libtdjni.so \
             aar/jni/arm64-v8a/

          cp -r td/td/telegram \
             aar/classes/

      - name: Build classes.jar
        run: |
          cd aar/classes

          javac \
            -source 8 \
            -target 8 \
            $(find . -name "*.java")

          jar cf ../classes.jar .

      - name: Create TDLib.aar
        run: |
          cd aar

          zip -r TDLib.aar \
            classes.jar \
            jni/

      - name: Upload TDLib.aar
        uses: actions/upload-artifact@v4
        with:
          name: TDLib-Android
          path: aar/TDLib.aar
