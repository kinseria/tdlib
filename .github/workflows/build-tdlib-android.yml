name: Build TDLib Android AAR

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: "26.1.10909125"

    steps:

    # -------------------------
    # Checkout
    # -------------------------

    - name: Checkout
      uses: actions/checkout@v4


    # -------------------------
    # Linux tools
    # -------------------------

    - name: Install build dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          git \
          cmake \
          ninja-build \
          zip \
          unzip \
          gperf \
          zlib1g-dev \
          libssl-dev \
          openssl


    # -------------------------
    # Java 17
    # -------------------------

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    # -------------------------
    # Android SDK
    # -------------------------

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install NDK
      run: |

        sdkmanager \
          "ndk;${NDK_VERSION}"

        echo \
        "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" \
        >> $GITHUB_ENV



    # -------------------------
    # Download TDLib
    # -------------------------

    - name: Clone TDLib
      run: |

        git clone \
          --recursive \
          https://github.com/tdlib/td.git



    # -------------------------
    # Generate TDLib files
    # -------------------------

    - name: Generate TDLib sources
      run: |

        mkdir td/build-generator

        cmake \
          -S td \
          -B td/build-generator \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release


        cmake \
          --build td/build-generator \
          --target generate



    # -------------------------
    # Build Android ARM64
    # -------------------------

    - name: Build arm64-v8a
      run: |

        mkdir build-arm64


        cmake \
          -S td \
          -B build-arm64 \
          -GNinja \
          -DCMAKE_BUILD_TYPE=Release \
          -DTD_ENABLE_JNI=ON \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21


        ninja -C build-arm64



    # -------------------------
    # Find output
    # -------------------------

    - name: Check TDLib output
      run: |

        echo "Searching JNI library"

        find . -name "libtdjni.so" || true

        echo "Searching Java files"

        find . -name "TdApi.java" || true
        find . -name "Client.java" || true



    # -------------------------
    # Prepare AAR
    # -------------------------

    - name: Prepare AAR
      run: |

        mkdir -p aar/jni/arm64-v8a
        mkdir -p aar/classes


        JNI=$(find build-arm64 -name libtdjni.so | head -1)

        if [ -z "$JNI" ]; then
          echo "libtdjni.so not found"
          exit 1
        fi


        cp "$JNI" \
          aar/jni/arm64-v8a/


        JAVA_DIR=$(dirname \
          $(find td -name TdApi.java | head -1))


        if [ -z "$JAVA_DIR" ]; then
          echo "TdApi.java not found"
          exit 1
        fi


        cp -r "$JAVA_DIR"/* \
          aar/classes/



    # -------------------------
    # Compile Java
    # -------------------------

    - name: Compile Java
      run: |

        mkdir classes


        javac \
          -source 8 \
          -target 8 \
          $(find aar/classes -name "*.java") \
          -d classes



    # -------------------------
    # Make jar
    # -------------------------

    - name: Create classes.jar
      run: |

        cd classes

        jar cf ../classes.jar .

        cd ..



    # -------------------------
    # Make AAR
    # -------------------------

    - name: Create TDLib.aar
      run: |

        mkdir final-aar

        cp classes.jar final-aar/


        cp -r aar/jni final-aar/


        cd final-aar

        zip -r TDLib.aar .



    # -------------------------
    # Upload
    # -------------------------

    - name: Upload TDLib.aar
      uses: actions/upload-artifact@v4
      with:

        name: TDLib-aar

        path: final-aar/TDLib.aar
