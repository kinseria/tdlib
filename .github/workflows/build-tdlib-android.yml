name: Build TDLib Android AAR

on:
  workflow_dispatch:

jobs:
  build-tdlib:
    runs-on: ubuntu-22.04

    env:
      NDK_VERSION: 26.1.10909125
      TD_VERSION: master

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            cmake \
            ninja-build \
            unzip \
            zip

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"

      - name: Set NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV


      - name: Clone TDLib
        run: |
          git clone \
            --depth 1 \
            --branch ${TD_VERSION} \
            https://github.com/tdlib/td.git


      ##################################################
      # Build each Android ABI
      ##################################################

      - name: Build arm64-v8a
        run: |
          ./build-android.sh arm64-v8a


      - name: Build armeabi-v7a
        run: |
          ./build-android.sh armeabi-v7a


      - name: Build x86_64
        run: |
          ./build-android.sh x86_64


      ##################################################
      # Package AAR
      ##################################################

      - name: Create AAR folders
        run: |
          mkdir -p aar/jni
          mkdir -p aar/classes


      - name: Copy native libraries
        run: |
          cp -r output/arm64-v8a \
             aar/jni/

          cp -r output/armeabi-v7a \
             aar/jni/

          cp -r output/x86_64 \
             aar/jni/


      - name: Copy Java sources
        run: |
          cp -r td/example/android/tdlib/src/main/java/* \
             aar/classes/


      - name: Compile Java
        run: |
          cd aar/classes

          mkdir -p ../../classes

          javac \
            -source 8 \
            -target 8 \
            $(find . -name "*.java") \
            -d ../../classes


      - name: Create classes.jar
        run: |
          cd classes
          jar cf ../aar/classes.jar .


      - name: Create TDLib.aar
        run: |
          cd aar
          zip -r TDLib.aar \
            classes.jar \
            jni/


      - name: Upload TDLib.aar
        uses: actions/upload-artifact@v4
        with:
          name: TDLib-aar
          path: aar/TDLib.aar
